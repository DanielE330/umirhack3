# Весь стек HoneyForge одной командой (микросервисы):
#   proxy        — единый вход :4000 (Caddy): веб-интерфейс и API центра, /api/v1/* — оркестратор
#   center       — вход с 2FA, веб-интерфейс, профили, ловушки, приём телеметрии агентов, события
#   db           — PostgreSQL центра
#   orchestrator — сервис управления машинами-ловушками в Proxmox (только по межсервисному токену)
#   honeymind    — AI-аналитика событий (threat_score/category/is_human); только во внутренней
#                  сети backend, порт наружу не публикуется — доступен лишь центру (он принимает
#                  события от агентов, см. backend/center/app/routers/agent_api.py)
# Запуск из папки infra/: cp .env.example .env && заполнить && docker compose up -d --build
name: honeyforge-center

services:
  proxy:
    image: caddy:2-alpine
    container_name: hf-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        ipv4_address: 172.31.40.10   # центр доверяет X-Forwarded-For только от этого адреса
    depends_on: [center, orchestrator]
    restart: unless-stopped

  center:
    build:
      context: ..                       # корень репозитория: в образ центра кладётся frontend/
      dockerfile: backend/center/Dockerfile
    container_name: hf-center
    env_file: .env
    environment:
      HF_DATABASE_URL: postgresql+psycopg://honeyforge:${HF_DB_PASSWORD:?задайте HF_DB_PASSWORD}@db:5432/honeyforge
      HF_ORCHESTRATOR_URL: http://orchestrator:4000
      HF_ORCHESTRATOR_TOKEN: ${ORCH_TOKEN:?задайте ORCH_TOKEN}
      HF_TRUSTED_PROXIES: 172.31.40.10
      # AI-аналитика событий агента (threat_score/category/is_human) — honeymind виден только
      # через внутреннюю сеть backend, см. honeymind/README.md
      HF_HONEYMIND_URL: http://honeymind:8001
      HF_HONEYMIND_TOKEN: ${HONEYMIND_TOKEN:?задайте HONEYMIND_TOKEN}
      HF_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      NO_PROXY: "127.0.0.1,localhost,192.168.1.94,10.20.0.0/24,orchestrator,center,db,honeymind"
      no_proxy: "127.0.0.1,localhost,192.168.1.94,10.20.0.0/24,orchestrator,center,db,honeymind"
    volumes:
      - ../frontend:/srv/frontend:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      backend: {}
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: hf-center-db
    environment:
      POSTGRES_USER: honeyforge
      POSTGRES_PASSWORD: ${HF_DB_PASSWORD:?задайте HF_DB_PASSWORD}
      POSTGRES_DB: honeyforge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro   # отдельная база оркестратора при первом запуске
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeyforge"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  orchestrator:
    build: ../backend/orchestrator
    container_name: hf-orchestrator
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      ORCH_TOKEN: ${ORCH_TOKEN:?задайте ORCH_TOKEN}
      DATABASE_URL: postgresql+asyncpg://honeyforge:${HF_DB_PASSWORD}@db:5432/orchestrator
      PROXMOX_HOST: ${PROXMOX_HOST:-192.168.1.94}
      PROXMOX_USER: ${PROXMOX_USER:-root@pam}
      PROXMOX_PASSWORD: ${PROXMOX_PASSWORD:-}
      PROXMOX_TOKEN_NAME: ${PROXMOX_TOKEN_NAME:-}
      PROXMOX_TOKEN_VALUE: ${PROXMOX_TOKEN_VALUE:-}
      PROXMOX_TEMPLATE_LXC: ${PROXMOX_TEMPLATE_LXC:-9101}
      PROXMOX_STORAGE: ${PROXMOX_STORAGE:-hdd}
      PROXMOX_BRIDGE: ${PROXMOX_BRIDGE:-vmbr1}
      PROXMOX_NETWORK: ${PROXMOX_NETWORK:-10.20.0.0/24}
      PROXMOX_GATEWAY: ${PROXMOX_GATEWAY:-10.20.0.1}
      PROXMOX_POOL: ${PROXMOX_POOL:-honeyforge}
      # Уведомления об атаках в Telegram; пусто — выключены
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      HF_CENTER_URL: http://center:4000
      NO_PROXY: "127.0.0.1,localhost,192.168.1.94,10.20.0.0/24,orchestrator,center,db,honeymind"
      no_proxy: "127.0.0.1,localhost,192.168.1.94,10.20.0.0/24,orchestrator,center,db,honeymind"
      # Узкий SSH-доступ к хосту Proxmox для включения агентов (infra/proxmox/hf-agent-ctl)
      PVE_SSH_HOST: ${PVE_SSH_HOST:-}
    volumes:
      - ./secrets:/run/hf-secrets:ro   # pve_agent_ed25519 + known_hosts, только на сервере, не в git
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  honeymind:
    build: ../honeymind
    container_name: hf-honeymind
    environment:
      HONEYMIND_TOKEN: ${HONEYMIND_TOKEN:?задайте HONEYMIND_TOKEN}
      HONEYMIND_DOCS: "0"
      HONEYMIND_STATE_DB: /data/state.db
    volumes:
      - honeymind-state:/data
    networks:
      backend: {}          # только внутренняя сеть — порт наружу и в default не публикуем
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.40.0/24
  backend:
    internal: true          # нет выхода наружу; доступен только сервисам, подключённым к ней (center)

volumes:
  pgdata:
  honeymind-state:
